name: pipeline

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore trial data
        env:
          TRIALS_CSV: ${{ secrets.TRIALS_CSV }}
        run: printf '%s\n' "$TRIALS_CSV" > data/raw/trials.csv
      - name: Run pipeline
        env:
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
        run: python -m src.pipeline
